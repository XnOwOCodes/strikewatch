[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strikewatch"
version = "0.1.0"
description = "Background options-alpha pager that paper-trades defined-risk structures only when every risk gate passes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jordi / XnOwOCodes" }]
keywords = ["alpaca", "options", "paper-trading", "pager", "agents"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
strikewatch = "strikewatch.__main__:main"

[project.urls]
Homepage = "https://github.com/XnOwOCodes/strikewatch"
Hackathon = "https://lablab.ai"

[tool.setuptools.packages.find]
include = ["strikewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
